<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森林金币挑战</title><link rel="stylesheet" href="./style.css"></head><body><div id="stage">
  <canvas id="game" width="720" height="1080"></canvas>
  <div id="hud">
    <div id="scoreBox">得分 <span id="score">0</span></div>
    <div id="missBox">漏接 <span id="miss">0</span>/3</div>
    <button id="pauseBtn" type="button">暂停</button>
  </div>
  <div id="overlay" class="hidden">
    <div id="panel">
      <h1 id="title">森林金币挑战</h1>
      <p id="subtitle">操控小狐狸左右移动，接住掉落的金币。<br>每枚金币+5分，漏接三次游戏结束。</p>
      <div id="finalScore" class="hidden">最终得分：<span id="finalScoreVal">0</span></div>
      <button id="primaryBtn" type="button">开始游戏</button>
    </div>
  </div>
  <div id="touch">
    <button id="leftBtn" type="button">◀</button>
    <button id="rightBtn" type="button">▶</button>
  </div>
</div><script src="./game.js" defer></script></body></html>
